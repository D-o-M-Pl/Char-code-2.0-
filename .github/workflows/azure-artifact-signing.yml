name: Windows Authenticode Signing

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sign:
    name: Azure Artifact Signing
    runs-on: windows-2025
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build EXE and MSI
        shell: pwsh
        run: .\installers\build-installer.ps1 -Target all

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode sign with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installers\output
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem installers\output\*.exe, installers\output\*.msi
          if ($files.Count -eq 0) {
            throw "No Windows artifacts found."
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName

            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($file.Name): $($signature.Status)"
            }

            Write-Host "$($file.Name): $($signature.Status) / $($signature.SignerCertificate.Subject)"
          }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $lines = Get-ChildItem installers\output\*.exe, installers\output\*.msi |
            Sort-Object Name |
            ForEach-Object {
              $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$digest  $($_.Name)"
            }

          $lines | Set-Content installers\output\SHA256SUMS-WINDOWS.txt

      - name: Attest Authenticode-signed files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            installers/output/*.exe
            installers/output/*.msi

      - name: Upload Authenticode-signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-authenticode
          path: |
            installers/output/*.exe
            installers/output/*.msi
            installers/output/SHA256SUMS-WINDOWS.txt
