name: Windows Authenticode Signing

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sign:
    name: Azure Artifact Signing
    runs-on: windows-2025
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build EXE and MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\installers\build-installer.ps1 -Target all

          $files = @(
              Get-ChildItem installers\output\*.exe, installers\output\*.msi `
                  -ErrorAction SilentlyContinue
          )

          if ($files.Count -eq 0) {
              throw "No Windows artifacts were generated."
          }

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode sign final Windows artifacts
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\installers\output
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
              Get-ChildItem installers\output\*.exe, installers\output\*.msi `
                  -ErrorAction SilentlyContinue
          )

          if ($files.Count -eq 0) {
              throw "No Windows artifacts found."
          }

          foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature $file.FullName

              if ($signature.Status -ne "Valid") {
                  throw "Invalid Authenticode signature for $($file.Name): $($signature.Status)"
              }

              Write-Host "$($file.Name): $($signature.Status) / $($signature.SignerCertificate.Subject)"
          }

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign final Authenticode bytes with Sigstore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
              Get-ChildItem installers\output\*.exe, installers\output\*.msi `
                  -ErrorAction Stop
          )

          foreach ($file in $files) {
              $bundle = "$($file.FullName).sigstore.json"
              & cosign sign-blob --yes --bundle $bundle $file.FullName

              if ($LASTEXITCODE -ne 0) {
                  throw "Cosign signing failed for $($file.Name)."
              }

              if (-not (Test-Path $bundle)) {
                  throw "Sigstore bundle was not generated for $($file.Name)."
              }
          }

      - name: Generate Windows SHA-256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
              Get-ChildItem installers\output\*.exe, installers\output\*.msi `
                  -ErrorAction Stop |
                  Sort-Object Name
          )

          $lines = foreach ($file in $files) {
              $digest = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$digest  $($file.Name)"
          }

          $lines | Set-Content installers\output\SHA256SUMS-WINDOWS.txt -Encoding ascii

      - name: Attest final Authenticode-signed files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            installers/output/*.exe
            installers/output/*.msi

      - name: Upload final Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            installers/output/*.exe
            installers/output/*.msi
            installers/output/*.sigstore.json
            installers/output/SHA256SUMS-WINDOWS.txt
          if-no-files-found: error
          retention-days: 7
