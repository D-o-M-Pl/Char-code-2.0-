name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO Sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check commit sign-offs
        uses: christophebedard/dco-check@0.5.0
        with:
          python-version: '3.12'
