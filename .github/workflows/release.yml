name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      digests: ${{ steps.hashes.outputs.digests }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Validate
        run: |
          npm run typecheck
          npm run build
          npm run test:e2e
          npm run validate

      - name: Package source distribution
        run: |
          mkdir -p release
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='release' \
            -czf "release/char-code-${GITHUB_REF_NAME}.tar.gz" .

      - name: Generate SHA-256 checksums
        id: hashes
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          {
            echo "digests<<EOF"
            cat SHA256SUMS.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest source artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: release/

  windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installers
        shell: pwsh
        run: .\installers\build-installer.ps1 -Target all

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Checksums and signatures
        shell: pwsh
        run: |
          $files = Get-ChildItem installers\output\*.exe, installers\output\*.msi
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
            cosign sign-blob --yes --bundle "$($file.FullName).sigstore.json" $file.FullName
          }
          $lines | Set-Content installers\output\SHA256SUMS-WINDOWS.txt

      - name: Attest Windows artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            installers/output/*.exe
            installers/output/*.msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            installers/output/*.exe
            installers/output/*.msi
            installers/output/*.sigstore.json
            installers/output/SHA256SUMS-WINDOWS.txt

  publish:
    name: Publish GitHub Release
    needs: [build-release, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate combined SHA-256
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS*.txt' \
            -print0 |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*
