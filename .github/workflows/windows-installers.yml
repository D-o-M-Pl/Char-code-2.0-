name: Windows Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  installers:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build MSI
        shell: pwsh
        run: .\installers\build-installer.ps1 -Target msi

      - name: Build EXE
        shell: pwsh
        run: .\installers\build-installer.ps1 -Target exe

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: char-code-windows-installers
          path: |
            installers/output/*.msi
            installers/output/*.exe
          if-no-files-found: error
