name: Production Release Gate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, e.g. v2.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  integrity:
    name: Verify SHA256 and GitHub Attestations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Verify SHA-256
        shell: bash
        run: |
          cd release
          test -f SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.tar.gz release/*.exe release/*.msi)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No attested release artifacts found."
            exit 1
          fi

          for file in "${files[@]}"; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"
          done

  sigstore:
    name: Verify Sigstore Signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Windows Sigstore bundles
        shell: bash
        run: |
          shopt -s nullglob
          subjects=(release/*.exe release/*.msi)

          if [ "${#subjects[@]}" -eq 0 ]; then
            echo "No Windows release artifacts found."
            exit 1
          fi

          for subject in "${subjects[@]}"; do
            bundle="${subject}.sigstore.json"
            test -f "$bundle"

            cosign verify-blob \
              --bundle "$bundle" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$subject"
          done

  containers:
    name: Verify Signed Container Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      api_image: ${{ steps.manifest.outputs.api_image }}
      web_image: ${{ steps.manifest.outputs.web_image }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve and verify immutable images
        id: manifest
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          api_tag="ghcr.io/${repo}/api:${TAG}"
          web_tag="ghcr.io/${repo}/web:${TAG}"

          api_digest="$(docker buildx imagetools inspect "$api_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          web_digest="$(docker buildx imagetools inspect "$web_tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"

          test -n "$api_digest"
          test -n "$web_digest"

          api_image="ghcr.io/${repo}/api@${api_digest}"
          web_image="ghcr.io/${repo}/web@${web_digest}"

          for image in "$api_image" "$web_image"; do
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign-containers.yml@" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$image"
          done

          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"

  slsa:
    name: Verify SLSA Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release

      - name: Install SLSA verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Verify source provenance
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(release/char-code-*.tar.gz)
          provenances=(release/*.intoto.jsonl)

          test "${#artifacts[@]}" -gt 0
          test "${#provenances[@]}" -gt 0

          slsa-verifier verify-artifact "${artifacts[0]}" \
            --provenance-path "${provenances[0]}" \
            --source-uri "github.com/${GITHUB_REPOSITORY}" \
            --source-tag "$TAG"

  authenticode:
    name: Verify Windows Authenticode
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Download release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir release

      - name: Verify Authenticode
        shell: pwsh
        run: |
          $files = Get-ChildItem release\*.exe, release\*.msi -ErrorAction SilentlyContinue

          if (-not $files) {
            throw "No Windows artifacts found."
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file.FullName

            if ($signature.Status -ne "Valid") {
              throw "Authenticode verification failed for $($file.Name): $($signature.Status)"
            }
          }

  production-approved:
    name: Production Artifact Gate
    needs:
      - integrity
      - sigstore
      - containers
      - slsa
      - authenticode
    runs-on: ubuntu-latest
    environment: production-approval

    steps:
      - name: Create immutable deployment manifest
        env:
          TAG: ${{ inputs.tag }}
          API_IMAGE: ${{ needs.containers.outputs.api_image }}
          WEB_IMAGE: ${{ needs.containers.outputs.web_image }}
        shell: bash
        run: |
          mkdir deployment
          cat > deployment/verified-release.env <<EOF
          RELEASE_TAG=$TAG
          RELEASE_SHA=$GITHUB_SHA
          API_IMAGE=$API_IMAGE
          WEB_IMAGE=$WEB_IMAGE
          VERIFIED_GATE_RUN=$GITHUB_RUN_ID
          EOF

          cat deployment/verified-release.env

      - name: Upload verified deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-release
          path: deployment/verified-release.env
          retention-days: 30
