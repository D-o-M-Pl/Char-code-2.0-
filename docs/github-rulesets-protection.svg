<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Char-code GitHub Branch and Tag Protection</title>
<desc id="desc">All branches block deletion and force push. Main and release branches additionally require pull requests, reviews and green security checks. Version tags cannot be updated or deleted, with v2.0.0 explicitly immutable.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
  <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".16"/></filter>
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#64748b;stroke-width:2;rx:18;filter:url(#shadow)}
    .green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:18}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:18}
    .orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:18}
    .title{font:700 34px Arial,sans-serif;fill:#0f172a}.h{font:700 19px Arial,sans-serif;fill:#0f172a}
    .t{font:500 14px Arial,sans-serif;fill:#334155}.edge{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="1500" height="900"/>
<text x="55" y="60" class="title">Char-code — GitHub Ruleset Protection</text>
<text x="55" y="92" class="t">Automated with gh api for every selected D-o-M-Pl repository.</text>

<rect x="80" y="150" width="300" height="130" class="blue"/>
<text x="130" y="195" class="h">All branches (~ALL)</text>
<text x="125" y="230" class="t">Deletion blocked</text>
<text x="125" y="255" class="t">Force push blocked</text>

<rect x="475" y="135" width="300" height="160" class="green"/>
<text x="525" y="180" class="h">main</text>
<text x="520" y="213" class="t">PR + CODEOWNERS + review</text>
<text x="520" y="238" class="t">DCO · CodeQL · Gitleaks</text>
<text x="520" y="263" class="t">Real PostgreSQL RLS</text>

<rect x="870" y="135" width="300" height="160" class="orange"/>
<text x="920" y="180" class="h">release/*</text>
<text x="915" y="213" class="t">2 approvals + CODEOWNERS</text>
<text x="915" y="238" class="t">all production checks</text>
<text x="915" y="263" class="t">SBOM required</text>

<path class="edge" d="M380 215 L475 215"/>
<path class="edge" d="M775 215 L870 215"/>

<rect x="275" y="445" width="330" height="145" class="red"/>
<text x="330" y="490" class="h">Version tags v*</text>
<text x="325" y="525" class="t">Cannot be updated</text>
<text x="325" y="550" class="t">Cannot be deleted</text>

<rect x="895" y="445" width="330" height="145" class="red"/>
<text x="950" y="490" class="h">v2.0.0</text>
<text x="945" y="525" class="t">Explicit immutable ruleset</text>
<text x="945" y="550" class="t">No overwrite · no deletion</text>

<path class="edge" d="M625 295 C625 370 440 370 440 445"/>
<path class="edge" d="M1020 295 L1060 445"/>

<rect x="460" y="720" width="580" height="105" class="box"/>
<text x="525" y="762" class="h">scripts/apply-github-rulesets.ps1</text>
<text x="515" y="795" class="t">GET existing ruleset → PUT update or POST create → Active enforcement</text>

<path class="edge" d="M440 590 C440 665 650 665 650 720"/>
<path class="edge" d="M1060 590 C1060 665 850 665 850 720"/>
</svg>
