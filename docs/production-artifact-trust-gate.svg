<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">Char-code 2.0 Production Artifact Trust Gate</title>
<desc id="desc">Windows installers are Authenticode signed using Azure Artifact Signing and all release artifacts are verified for checksums, GitHub attestations, Sigstore and SLSA before production approval.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
  <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".16"/></filter>
  <style>
    .bg{fill:#f8fafc}.box{fill:white;stroke:#64748b;stroke-width:2;rx:18;filter:url(#shadow)}
    .blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:18}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:18}
    .orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:18}
    .title{font:700 34px Arial,sans-serif;fill:#0f172a}.h{font:700 19px Arial,sans-serif;fill:#0f172a}
    .t{font:500 14px Arial,sans-serif;fill:#334155}.edge{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="1500" height="920"/>
<text x="55" y="60" class="title">Char-code 2.0 — Production Artifact Trust Gate</text>
<text x="55" y="92" class="t">No rebuild after verification: production consumes the exact immutable artifacts that passed the gate.</text>

<rect x="65" y="150" width="230" height="105" class="box"/>
<text x="115" y="190" class="h">Protected Tag</text>
<text x="115" y="220" class="t">vX.Y.Z</text>

<rect x="365" y="135" width="260" height="135" class="blue"/>
<text x="420" y="178" class="h">Windows Build</text>
<text x="410" y="210" class="t">WiX MSI + Inno EXE</text>
<text x="410" y="238" class="t">windows-2025</text>

<rect x="700" y="135" width="280" height="135" class="orange"/>
<text x="745" y="178" class="h">Azure Artifact Signing</text>
<text x="745" y="210" class="t">OIDC · Authenticode</text>
<text x="745" y="238" class="t">RFC3161 timestamp</text>

<rect x="1055" y="135" width="280" height="135" class="purple"/>
<text x="1105" y="178" class="h">Sigstore + Provenance</text>
<text x="1095" y="210" class="t">Cosign · GitHub Attestation</text>
<text x="1095" y="238" class="t">SLSA provenance</text>

<path class="edge" d="M295 202 L365 202"/>
<path class="edge" d="M625 202 L700 202"/>
<path class="edge" d="M980 202 L1055 202"/>

<rect x="100" y="410" width="250" height="125" class="green"/>
<text x="155" y="453" class="h">SHA-256</text>
<text x="145" y="485" class="t">strict checksum verify</text>

<rect x="410" y="410" width="250" height="125" class="green"/>
<text x="455" y="453" class="h">Authenticode</text>
<text x="450" y="485" class="t">Get-AuthenticodeSignature</text>

<rect x="720" y="410" width="250" height="125" class="green"/>
<text x="770" y="453" class="h">Sigstore</text>
<text x="765" y="485" class="t">workflow identity verify</text>

<rect x="1030" y="410" width="250" height="125" class="green"/>
<text x="1080" y="453" class="h">SLSA + GH</text>
<text x="1075" y="485" class="t">provenance attestations</text>

<path class="edge" d="M1195 270 C1195 345 225 340 225 410"/>
<path class="edge" d="M1195 270 C1195 345 535 340 535 410"/>
<path class="edge" d="M1195 270 C1195 345 845 340 845 410"/>
<path class="edge" d="M1195 270 L1155 410"/>

<rect x="440" y="675" width="620" height="130" class="blue"/>
<text x="540" y="720" class="h">GitHub production environment</text>
<text x="520" y="752" class="t">required reviewers + protected release tag + all verification jobs green</text>
<text x="560" y="782" class="t">deployment consumes exact verified artifacts</text>

<path class="edge" d="M225 535 C225 620 600 620 620 675"/>
<path class="edge" d="M535 535 C535 620 660 620 680 675"/>
<path class="edge" d="M845 535 C845 620 820 620 820 675"/>
<path class="edge" d="M1155 535 C1155 620 900 620 880 675"/>

<rect x="375" y="850" width="750" height="45" class="box"/>
<text x="425" y="879" class="t">FAIL-CLOSED: any invalid signature, checksum or provenance blocks production approval.</text>
</svg>
