<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Char-code 2.0 GitHub Security Gate</title>
<desc id="desc">Pull requests pass DCO, CodeQL, secret scanning, dependency checks, SBOM generation, reviews, and branch rules before merge and release.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
  </marker>
  <filter id="shadow">
    <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".15"/>
  </filter>
  <style>
    .bg{fill:#f8fafc}
    .box{fill:#fff;stroke:#64748b;stroke-width:2;rx:18;filter:url(#shadow)}
    .good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:18}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18}
    .sec{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:18}
    .title{font:700 34px Arial,sans-serif;fill:#0f172a}
    .h{font:700 19px Arial,sans-serif;fill:#0f172a}
    .t{font:500 14px Arial,sans-serif;fill:#334155}
    .edge{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
  </style>
</defs>

<rect class="bg" width="1500" height="900"/>
<text x="60" y="60" class="title">Char-code 2.0 — GitHub Security &amp; Release Gate</text>
<text x="60" y="92" class="t">main and release/* are protected by rulesets and mandatory security checks.</text>

<rect x="70" y="150" width="230" height="105" class="box"/>
<text x="115" y="190" class="h">Pull Request</text>
<text x="115" y="220" class="t">No direct push to protected branches</text>

<rect x="365" y="135" width="230" height="135" class="good"/>
<text x="415" y="178" class="h">DCO</text>
<text x="405" y="210" class="t">Signed-off-by required</text>
<text x="405" y="235" class="t">Contributor attestation</text>

<rect x="660" y="135" width="230" height="135" class="sec"/>
<text x="710" y="178" class="h">CodeQL</text>
<text x="700" y="210" class="t">security-extended queries</text>
<text x="700" y="235" class="t">TypeScript/JavaScript analysis</text>

<rect x="955" y="135" width="230" height="135" class="warn"/>
<text x="1000" y="178" class="h">Secret Scan</text>
<text x="995" y="210" class="t">Gitleaks</text>
<text x="995" y="235" class="t">full Git history</text>

<rect x="1250" y="135" width="180" height="135" class="box"/>
<text x="1282" y="178" class="h">Dependabot</text>
<text x="1282" y="210" class="t">npm</text>
<text x="1282" y="235" class="t">Docker / Actions</text>

<path class="edge" d="M300 202 L365 202"/>
<path class="edge" d="M595 202 L660 202"/>
<path class="edge" d="M890 202 L955 202"/>
<path class="edge" d="M1185 202 L1250 202"/>

<rect x="250" y="385" width="280" height="125" class="sec"/>
<text x="300" y="428" class="h">Build + Tests</text>
<text x="300" y="460" class="t">typecheck · build · E2E</text>
<text x="300" y="485" class="t">tenant isolation</text>

<rect x="610" y="385" width="280" height="125" class="good"/>
<text x="660" y="428" class="h">SBOM</text>
<text x="660" y="460" class="t">CycloneDX + SPDX</text>
<text x="660" y="485" class="t">release artifact</text>

<rect x="970" y="385" width="280" height="125" class="box"/>
<text x="1015" y="428" class="h">CODEOWNERS Review</text>
<text x="1015" y="460" class="t">security-sensitive code</text>
<text x="1015" y="485" class="t">review required</text>

<path class="edge" d="M1340 270 C1340 330 390 320 390 385"/>
<path class="edge" d="M530 447 L610 447"/>
<path class="edge" d="M890 447 L970 447"/>

<rect x="270" y="630" width="360" height="130" class="good"/>
<text x="330" y="675" class="h">main Ruleset</text>
<text x="330" y="707" class="t">1 review · CODEOWNERS · status checks</text>
<text x="330" y="735" class="t">no force push · no deletion</text>

<rect x="850" y="630" width="360" height="130" class="warn"/>
<text x="910" y="675" class="h">release/* Ruleset</text>
<text x="910" y="707" class="t">2 reviews · CODEOWNERS · status checks</text>
<text x="910" y="735" class="t">no force push · no deletion</text>

<path class="edge" d="M1110 510 C1110 570 450 570 450 630"/>
<path class="edge" d="M1110 510 L1030 630"/>

<rect x="540" y="805" width="420" height="60" class="sec"/>
<text x="605" y="842" class="h">Merge / Release only after green gate</text>

<path class="edge" d="M450 760 C450 790 650 790 650 805"/>
<path class="edge" d="M1030 760 C1030 790 850 790 850 805"/>
</svg>
