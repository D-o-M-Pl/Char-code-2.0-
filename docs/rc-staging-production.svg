<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Char-code 2.0 RC Staging Approval Production Flow</title>
<desc id="desc">Signed release candidate images are verified, deployed by immutable digest to staging slots, smoke tested, manually approved, swapped into production and automatically reversed if production validation fails.</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker>
  <filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".15"/></filter>
  <style>
    .bg{fill:#f8fafc}.b{fill:#fff;stroke:#64748b;stroke-width:2;rx:18;filter:url(#s)}
    .g{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:18}.o{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:18}
    .p{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:18}.r{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:18}
    .h1{font:700 32px Arial;fill:#0f172a}.h{font:700 18px Arial;fill:#0f172a}.t{font:500 14px Arial;fill:#334155}
    .e{stroke:#334155;stroke-width:2.4;fill:none;marker-end:url(#a)}
  </style>
</defs>
<rect class="bg" width="1500" height="900"/>
<text x="55" y="58" class="h1">Char-code 2.0 — v2.0.0-rc.1 → Staging → Approval → Production</text>

<rect x="60" y="130" width="210" height="100" class="b"/>
<text x="103" y="171" class="h">RC Tag</text><text x="100" y="202" class="t">v2.0.0-rc.1</text>

<rect x="335" y="130" width="245" height="100" class="p"/>
<text x="380" y="171" class="h">Verify Supply Chain</text><text x="375" y="202" class="t">Cosign + immutable digests</text>

<rect x="650" y="130" width="245" height="100" class="g"/>
<text x="710" y="171" class="h">Staging Slots</text><text x="695" y="202" class="t">API + Web by digest</text>

<rect x="965" y="130" width="245" height="100" class="g"/>
<text x="1020" y="171" class="h">Smoke Tests</text><text x="1005" y="202" class="t">health · auth · RLS boundary</text>

<path class="e" d="M270 180 L335 180"/><path class="e" d="M580 180 L650 180"/><path class="e" d="M895 180 L965 180"/>

<rect x="380" y="350" width="285" height="115" class="o"/>
<text x="435" y="395" class="h">Manual Approval</text><text x="420" y="428" class="t">GitHub protected environment</text>

<rect x="820" y="350" width="285" height="115" class="p"/>
<text x="890" y="395" class="h">Slot Swap</text><text x="865" y="428" class="t">staging → production</text>

<path class="e" d="M1085 230 C1085 300 522 300 522 350"/>
<path class="e" d="M665 407 L820 407"/>

<rect x="380" y="595" width="285" height="115" class="g"/>
<text x="430" y="640" class="h">Production Smoke</text><text x="420" y="673" class="t">Front Door + tenant checks</text>

<rect x="820" y="595" width="285" height="115" class="r"/>
<text x="875" y="640" class="h">Failure?</text><text x="850" y="673" class="t">reverse swap automatically</text>

<path class="e" d="M960 465 C960 535 522 535 522 595"/>
<path class="e" d="M665 652 L820 652"/>

<rect x="560" y="790" width="380" height="70" class="g"/>
<text x="640" y="833" class="h">Production v2.0.0 candidate verified</text>

<path class="e" d="M522 710 C522 760 680 760 680 790"/>
<path class="e" d="M962 710 C962 755 820 755 820 790"/>
</svg>
