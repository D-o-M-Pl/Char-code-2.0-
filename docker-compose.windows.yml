services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: development
      DATABASE_MODE: memory
    networks: [app]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    networks: [app]
    restart: unless-stopped

networks:
  app:
